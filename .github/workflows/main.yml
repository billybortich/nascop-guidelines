name: Build Kenya Guidelines APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and sync Capacitor
        working-directory: nascop-app
        run: |
          npm install
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: yes | sdkmanager --licenses || true && sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Fix duplicate color resource
        working-directory: nascop-app/android
        run: rm -f app/src/main/res/values/ic_launcher_background.xml

      - name: Make gradlew executable
        working-directory: nascop-app/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: nascop-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Kenya-HIV-Guidelines-APK
          path: nascop-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
